<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060b1e">
    <title>XIZE Касса</title>
    <style>
        :root {
            --luckin-blue: #0b1430;       
            --luckin-light-blue: #162454; 
            --luckin-orange: #00f0ff;     
            --bg-dark: #060b1e;           
            --card-bg: #121f4d;           
            --text-light: #ffffff;        
            --text-muted: #7a8ebf;        
            --neon-glow: 0 0 15px rgba(0, 240, 255, 0.7); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px;
            min-height: 100vh;
        }

        .cashier-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--luckin-blue);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: var(--neon-glow);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .meta-info {
            background-color: var(--luckin-light-blue);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .meta-row:last-child {
            margin-bottom: 0;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .meta-value {
            font-weight: 700;
            color: #fff;
        }

        .order-items-list {
            margin-bottom: 25px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 12px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .item-details h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .item-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-price-qty {
            text-align: right;
            font-weight: 700;
        }

        .item-total-price {
            color: var(--luckin-orange);
            font-size: 1.05rem;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            margin-top: 2px;
        }

        .total-box {
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .total-amount {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--luckin-orange);
            text-shadow: var(--neon-glow);
        }

        .btn-action {
            width: 100%;
            background-color: var(--luckin-orange);
            color: #060b1e;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--neon-glow);
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .error-message {
            text-align: center;
            color: #ff3b30;
            font-weight: 700;
            margin-top: 40px;
            font-size: 1.1rem;
        }

        /* ===== Анимации ===== */
        .cashier-container { animation: popIn .5s cubic-bezier(.2,1.1,.3,1) both; }
        @keyframes popIn { from { transform: scale(.94) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
        h1 { animation: titleGlow 3s ease-in-out infinite; }
        @keyframes titleGlow { 0%,100% { text-shadow: 0 0 10px rgba(0,240,255,.4); } 50% { text-shadow: 0 0 22px rgba(0,240,255,.95); } }
        .item-row { animation: rowIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms + 250ms); }
        @keyframes rowIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
        .warn-row { background: rgba(255,59,48,.12); border: 1px solid rgba(255,59,48,.4); color: #ff8a80; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: .85rem; }
        .btn-action { animation: btnPulse 2.2s ease-in-out infinite; }
        .btn-action:disabled { opacity: .6; animation: none; }
        @keyframes btnPulse { 0%,100% { box-shadow: 0 0 12px rgba(0,240,255,.5); } 50% { box-shadow: 0 0 26px rgba(0,240,255,.95); } }
        #scan-overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(6,11,30,.9); z-index: 50; }
        #scan-overlay.show { display: flex; animation: fadeInOut var(--dur, 1.2s) ease both; }
        @keyframes fadeInOut { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        #scan-overlay svg { width: 120px; height: 120px; fill: none; stroke: var(--luckin-orange); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 10px var(--luckin-orange)); }
        #scan-overlay circle { stroke-dasharray: 327; stroke-dashoffset: 327; }
        #scan-overlay path { stroke-dasharray: 90; stroke-dashoffset: 90; }
        #scan-overlay.show circle { animation: draw .55s ease forwards; }
        #scan-overlay.show path { animation: draw .4s .45s ease forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        #scan-overlay-text { font-size: 1.3rem; font-weight: 800; text-shadow: var(--neon-glow); }
        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
        #wait-box { text-align: center; padding: 30px 0 10px; color: var(--text-muted); font-weight: 700; animation: popIn .5s both; }
        .radar { position: relative; width: 110px; height: 110px; margin: 0 auto 18px; }
        .radar span { position: absolute; inset: 0; border: 2px solid var(--luckin-orange); border-radius: 50%; opacity: 0; animation: radar 2.7s ease-out infinite; }
        .radar span:nth-child(2) { animation-delay: .9s; } .radar span:nth-child(3) { animation-delay: 1.8s; }
        .radar::after { content: ''; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--luckin-orange); box-shadow: var(--neon-glow); }
        @keyframes radar { from { transform: scale(.15); opacity: .9; } to { transform: scale(1); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>

    <div class="cashier-container">
        <h1>XIZE PREMIUM КАССА</h1>
        
        <div id="cashier-content" style="display: none;">
            <div class="meta-info">
                <div class="meta-row">
                    <span class="meta-label">Номер стола:</span>
                    <span class="meta-value" id="table-num">—</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Метод оплаты:</span>
                    <span class="meta-value" id="pay-method" style="color: #2ecc71;">—</span>
                </div>
            </div>

            <div class="order-items-list" id="items-container"></div>

            <div class="total-box">
                <span class="total-label">ИТОГО К ОПЛАТЕ:</span>
                <span class="total-amount" id="final-total">0 сомони</span>
            </div>

            <button class="btn-action" id="btn-close" onclick="clearAndCloseOrder()">Заказ Выдан / Оплачен</button>
        </div>

        <div id="error-box" class="error-message" style="display: none;">
            ⚠️ Ошибка: Данные QR-кода не обнаружены или повреждены!
        </div>
    </div>

    <div id="wait-box" style="display:none;"><div class="radar"><span></span><span></span><span></span></div><p>Ожидание следующего заказа...</p></div>
    <div id="scan-overlay" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52"/><path d="M34 62l17 17 35-38"/></svg><div id="scan-overlay-text"></div></div>
    <canvas id="confetti"></canvas>

    <script>
        const productsDB = {
            101: { name: "Raw coconut latte (pioneer)", price: 16 },
            102: { name: "Coconut ice from the American", price: 14 },
            103: { name: "Light coconut jasmine latte", price: 17 },
            104: { name: "Ice-smoked coconut latte", price: 18 },
            105: { name: "A Raised Coconut Trio Latte", price: 19 },
            106: { name: "Raw Coconut Velvet Latte", price: 17 },
            107: { name: "Meteorite latte", price: 18 },
            108: { name: "Black Sugar latte", price: 16 },
            109: { name: "Black Sugar Oat Latte", price: 18 },
            110: { name: "Muscatine cheese latte", price: 19 },
            111: { name: "Jasmine-scented latte", price: 16 },
            112: { name: "The Little Butter Latte", price: 17 },
            113: { name: "Velvet latte", price: 15 },
            114: { name: "Vanilla Velvet latte", price: 16 },
            115: { name: "Ethiopian Cakes Americano", price: 13 },
            116: { name: "Standard American Style", price: 11 },
            117: { name: "Deep-roasted Americano", price: 12 },
            118: { name: "Strengthen the Americano", price: 13 },
            119: { name: "Buttered Butter Americano", price: 15 },
            120: { name: "American style of jasmine", price: 14 },
            121: { name: "Deep-roasted lattes", price: 15 },
            122: { name: "Selected Audrey Hepburn latte", price: 18 },
            123: { name: "Oat latte", price: 16 },
            124: { name: "Sugary MacDoo", price: 15 },
            125: { name: "Vanilla latte", price: 15 },
            126: { name: "Cappuccino", price: 14 },
            127: { name: "Fruit C American (Лайм)", price: 14 },
            128: { name: "Orange C American", price: 14 },
            129: { name: "Apple C American", price: 14 },
            130: { name: "Pomelo C American", price: 15 },
            131: { name: "Cocoa Vienna", price: 16 },
            132: { name: "Crimson Moon Light", price: 17 },
            133: { name: "«520» Special Blend", price: 19 },
            201: { name: "Coconut cloud matcha", price: 17 },
            202: { name: "Cheddar cheese matcha", price: 18 },
            203: { name: "Rye matcha", price: 16 },
            204: { name: "Rye matcha (Large)", price: 19 },
            205: { name: "Matcha latte", price: 15 },
            206: { name: "Matcha velvet latte", price: 17 },
            207: { name: "Matcha good to drink", price: 18 },
            301: { name: "Little orange iced tea", price: 12 },
            302: { name: "Grape iced tea", price: 13 },
            303: { name: "Apple iced tea", price: 12 },
            304: { name: "Orange iced tea", price: 12 },
            305: { name: "Grapetweet C iced tea", price: 14 },
            306: { name: "Grape and lemon tea", price: 13 },
            307: { name: "Chilled mango sago cream", price: 16 },
            308: { name: "Coconut chilled mango", price: 16 },
            309: { name: "Iced young merina smoothie", price: 15 },
            310: { name: "Pure milk", price: 8 },
            311: { name: "Walden blue mango yogurt", price: 16 },
            312: { name: "Avocado soufflé yogurt", price: 18 },
            313: { name: "Avocado cheerios yogurt", price: 17 },
            314: { name: "Sweet gourd light fruit tea", price: 14 },
            315: { name: "Feathered light fruit", price: 14 },
            316: { name: "Feather jacket light body", price: 15 },
            401: { name: "Шаурма Классическая", price: 25 },
            402: { name: "Плов Лазер (Говядина)", price: 30 },
            403: { name: "Супер Комбо XIZE", price: 40 },
            501: { name: "Tilami sue cup cake", price: 14 },
            502: { name: "Banana cake", price: 12 },
            503: { name: "Honey cloud cake", price: 15 },
            504: { name: "Beef, cheese sandwich", price: 16 },
            505: { name: "Raw coconut floss", price: 13 },
            506: { name: "Basque cheese toast", price: 14 },
            507: { name: "Little butter praise", price: 10 },
            508: { name: "Chocolate‑flavored cookies", price: 8 }
        };

        window.onload = function() {
            parseOrderUrl();
        };

        function playScanSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Высокий чистый писк (Нота Ля)
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                // Быстрое затухание звука за 0.15 секунды
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Автовоспроизведение звука заблокировано или не поддерживается браузером");
            }
        }

        const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const CLOSED_KEY = 'xize_closed_orders';
        let currentOrderId = null;

        function loadClosed() { try { const v = JSON.parse(localStorage.getItem(CLOSED_KEY)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
        function saveClosed(id) { try { const l = loadClosed(); l.push(id); localStorage.setItem(CLOSED_KEY, JSON.stringify(l.slice(-200))); } catch (e) {} }

        function showError(text, color) {
            const b = document.getElementById("error-box");
            b.textContent = text; b.style.color = color || "";
            b.style.display = "block";
            document.getElementById("cashier-content").style.display = "none";
        }

        // Описание позиции: размер, температура, сахар, лёд (всё, что выбрал гость)
        function describeMods(id, mods) {
            if (id >= 400) return "Порция";
            const m = mods.split(",");
            const parts = [m.includes("*sizel") ? "Большой (+3 с.)" : m.includes("*sizes") ? "Маленький" : "Средний"];
            if (m.includes("*hot")) parts.push("Горячий"); else if (m.includes("*cold")) parts.push("Холодный");
            const sg = m.find(x => x.startsWith("*sg")); if (sg) parts.push("Сахар " + parseInt(sg.slice(3), 10) + "%");
            const ice = m.find(x => x.startsWith("*ice"));
            if (ice) parts.push({ "0": "Без льда", "1": "Мало льда", "2": "Лёд: нормально" }[ice.slice(4)] || "");
            return parts.filter(Boolean).join(" · ");
        }

        function countUp(el, to) {
            if (REDUCED) { el.textContent = `${to} сомони`; return; }
            const t0 = performance.now(), dur = 800;
            (function step(t) {
                const k = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
                el.textContent = `${Math.round(to * e)} сомони`;
                if (k < 1) requestAnimationFrame(step);
            })(t0);
        }

        function flashOverlay(text, ms) {
            const o = document.getElementById("scan-overlay");
            document.getElementById("scan-overlay-text").textContent = text;
            o.style.setProperty("--dur", ms + "ms");
            o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
            setTimeout(() => o.classList.remove("show"), ms);
        }

        function confetti() {
            if (REDUCED) return;
            const cv = document.getElementById("confetti"), c = cv.getContext("2d");
            cv.width = innerWidth; cv.height = innerHeight;
            const cols = ["#00f0ff", "#0055ff", "#2ecc71", "#ff0055", "#ffffff"];
            const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.6, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4, s: Math.random() * 6 + 3, r: Math.random() * 6, vr: (Math.random() - .5) * .4, col: cols[(Math.random() * cols.length) | 0] }));
            let last = performance.now();
            (function frame(t) {
                const dt = Math.min((t - last) / 16.667, 3); last = t;
                c.clearRect(0, 0, cv.width, cv.height);
                let alive = 0;
                for (const p of ps) {
                    p.vy += 0.45 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
                    if (p.y < cv.height + 20) alive++;
                    c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore();
                }
                if (alive) requestAnimationFrame(frame); else c.clearRect(0, 0, cv.width, cv.height);
            })(last);
        }

        function parseOrderUrl() {
            const q = new URLSearchParams(window.location.search);
            const data = q.get("data"), table = q.get("table"), pay = q.get("pay"), id = q.get("id");

            if (!data) { showError("⚠️ Ошибка: Данные QR-кода не обнаружены или повреждены!"); return; }
            if (id && loadClosed().includes(id)) { showError("✅ Этот заказ уже выдан. Попросите гостя показать новый QR-код.", "var(--text-muted)"); return; }
            currentOrderId = id;

            let finalTotal = 0, count = 0, itemsHtml = "";
            const unknown = [];

            data.split("|").forEach(part => {
                if (!part) return;
                const c = part.split("_");
                const pid = parseInt(c[0], 10);
                const qty = Math.min(99, Math.max(1, parseInt(c[1], 10) || 1)); // защита от отрицательных и огромных количеств
                const mods = c[2] || "";
                const product = productsDB[pid];
                if (!product) { unknown.push(String(c[0]).slice(0, 12)); return; }

                const basePrice = product.price + (pid < 400 && mods.includes("*sizel") ? 3 : 0);
                const itemTotal = basePrice * qty;
                finalTotal += itemTotal;
                itemsHtml += `
                    <div class="item-row" style="--i:${count}">
                        <div class="item-details">
                            <h3>${product.name}</h3>
                            <p>${describeMods(pid, mods)}</p>
                        </div>
                        <div class="item-price-qty">
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${qty} шт. x ${basePrice} с.</span>
                            <div class="item-total-price">${itemTotal} с.</div>
                        </div>
                    </div>`;
                count++;
            });

            if (count === 0) { showError("⚠️ Ошибка: в заказе нет известных позиций. Возможно, QR-код устарел."); return; }

            document.getElementById("table-num").textContent = table || "Не указан";
            document.getElementById("pay-method").textContent = pay || "На кассе";
            const container = document.getElementById("items-container");
            container.innerHTML = itemsHtml;
            unknown.forEach(u => {
                const w = document.createElement("div");
                w.className = "warn-row";
                w.textContent = `⚠️ Неизвестная позиция «${u}» пропущена. Проверьте заказ с гостем.`;
                container.appendChild(w);
            });

            document.getElementById("error-box").style.display = "none";
            document.getElementById("cashier-content").style.display = "block";
            playScanSound();
            flashOverlay("Заказ принят", 1100);
            countUp(document.getElementById("final-total"), finalTotal);
        }

        function clearAndCloseOrder() {
            const btn = document.getElementById("btn-close");
            if (btn.disabled) return;
            btn.disabled = true;
            if (currentOrderId) saveClosed(currentOrderId); // повторное сканирование этого QR уже не откроет заказ
            window.history.replaceState({}, document.title, window.location.pathname);
            flashOverlay("Заказ выдан!", 1500);
            confetti();
            setTimeout(() => {
                document.getElementById("cashier-content").style.display = "none";
                document.getElementById("wait-box").style.display = "block";
                btn.disabled = false;
            }, 800);
        }
    </script>
</body>
</html>
